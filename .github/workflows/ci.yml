name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a cancelled push to main would leave its commits unchecked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  services:
    name: Laptop services start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: sh infra/check-services.sh
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  database:
    name: Database tests (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://recall:recall@localhost:5432/recall
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/docker-compose.yml up -d --wait db
      - run: pnpm --filter @recall/db test:db
      - name: Migrations apply to the laptop database
        run: pnpm --filter @recall/db migrate && pnpm --filter @recall/db migrate
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs db
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose

  commit-messages:
    name: Commit messages start with a step id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check commits in this change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: nothing to compare."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Previous commit $BASE is gone (force-push); checking only the newest commit."
            BASE="$HEAD~1"
          fi
          node tools/repo-checks/src/check-commit-messages.ts "$BASE" "$HEAD"
