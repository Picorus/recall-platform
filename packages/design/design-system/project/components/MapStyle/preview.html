<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,100..800&family=Anek+Telugu:wdth,wght@75..125,100..800&family=Anek+Devanagari:wdth,wght@75..125,100..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--ink);font-family:var(--font-body)}
.wrap{padding:24px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;background:var(--surface-0)}
.lbl{font:600 12px/16px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-subtle);margin:0 0 8px}
.ramp{display:flex;height:16px;border-radius:4px;overflow:hidden}
.ramp i{flex:1}
.h1{background:var(--data-soft)}.h2{background:var(--data)}.h3{background:var(--ink)}
[data-theme="dark"] .h3{background:var(--brand)}
.ends{display:flex;justify-content:space-between;font:400 13px/18px var(--font-body);color:var(--ink-subtle);margin-top:4px}
@media (max-width:520px){.wrap{grid-template-columns:1fr}}
</style>
<div class="wrap">
<svg viewBox="0 0 320 200" role="img" aria-label="Map style: roads, a sold area, a route and a live bike">
<path d="M0 60 H320 M0 140 H320 M90 0 V200 M230 0 V200" stroke="var(--line)" stroke-width="2"/>
<path d="M0 100 C80 90 160 120 320 96" stroke="var(--line-strong)" stroke-width="4" fill="none"/>
<polygon points="110,40 210,30 250,110 170,170 100,130" fill="var(--data-soft)" stroke="var(--data)" stroke-width="2"/>
<polyline points="20,180 90,140 150,120 200,80 260,60" fill="none" stroke="var(--data)" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="200" cy="80" r="7" fill="var(--brand)" stroke="var(--on-brand)" stroke-width="2"/>
<text x="120" y="160" font-family="var(--font-body)" font-size="12" font-weight="600" fill="var(--ink-subtle)">MADHAPUR</text>
</svg>
<div>
<p class="lbl">Heat map</p>
<div class="ramp"><i class="h1"></i><i class="h2"></i><i class="h3"></i></div>
<div class="ends"><span>Few plays</span><span>Many</span></div>
</div>
</div>
