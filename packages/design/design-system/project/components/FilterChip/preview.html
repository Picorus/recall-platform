<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,100..800&family=Anek+Telugu:wdth,wght@75..125,100..800&family=Anek+Devanagari:wdth,wght@75..125,100..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
</style>
<div class="wrap"><div class="row" role="group" aria-label="Areas">
<button class="rc-chip" aria-pressed="true">Madhapur</button>
<button class="rc-chip" aria-pressed="false">Gachibowli</button>
<button class="rc-chip" aria-pressed="true">Hitec City</button>
<button class="rc-chip" aria-pressed="false">Kukatpally</button>
</div></div>
<script>
document.querySelectorAll('button.rc-chip').forEach(function (chip) {
  chip.addEventListener('click', function () {
    chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });
});
</script>
