<!doctype html>
<meta charset="utf-8" />
<body style="margin: 0; background: #000">
  <canvas id="c"></canvas>
  <script>
    let K = 1; // device pixels per drawing unit
    // Night-street pictures for RECALL, drawn in long-exposure style: wet roads, light trails, lamps, towers.
    function rng(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const SODIUM = [255, 176, 92],
      WARM = [255, 214, 160],
      COOL = [196, 220, 255],
      WHITE = [255, 246, 232],
      RED = [255, 52, 40],
      ION = [110, 123, 255],
      VOLT = [200, 245, 74],
      MAGENTA = [214, 92, 255];
    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    function glow(ctx, x, y, r, c, a) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(c, a));
      g.addColorStop(0.25, rgba(c, a * 0.45));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function sky(ctx, w, h, hy, haze = SODIUM, hazeA = 0.22) {
      const g = ctx.createLinearGradient(0, 0, 0, hy);
      g.addColorStop(0, '#03050b');
      g.addColorStop(0.55, '#0a1020');
      g.addColorStop(1, '#1b2238');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, hy + 2);
      const hz = ctx.createLinearGradient(0, hy - h * 0.28, 0, hy + 10);
      hz.addColorStop(0, rgba(haze, 0));
      hz.addColorStop(1, rgba(haze, hazeA));
      ctx.fillStyle = hz;
      ctx.fillRect(0, hy - h * 0.28, w, h * 0.28 + 10);
    }
    function towers(ctx, r, w, hy, opts) {
      const { count, minH, maxH, minW, maxW, lit, palette, blur, shade, x0 = 0, x1 = w } = opts;
      ctx.save();
      if (blur) ctx.filter = `blur(${K * blur}px)`;
      let x = x0 - r() * maxW;
      for (let i = 0; i < count && x < x1; i++) {
        const bw = minW + r() * (maxW - minW),
          bh = minH + r() * (maxH - minH);
        const top = hy - bh;
        const g = ctx.createLinearGradient(x, top, x + bw, top);
        g.addColorStop(0, shade[0]);
        g.addColorStop(1, shade[1]);
        ctx.fillStyle = g;
        ctx.fillRect(x, top, bw, bh + 2);
        // windows
        const cw = Math.max(3, bw / (6 + Math.floor(r() * 8))),
          ch = cw * (1.1 + r() * 0.5);
        const glass = opts.glass ?? r() < 0.4;
        for (let yy = top + ch; yy < hy - ch * 0.6; yy += ch) {
          const rowLit = r() < 0.85;
          for (let xx = x + cw * 0.5; xx < x + bw - cw * 0.6; xx += cw) {
            if (!rowLit || r() > lit) continue;
            const c = palette[Math.floor(r() * palette.length)];
            ctx.fillStyle = rgba(c, 0.35 + r() * 0.6);
            ctx.fillRect(xx, yy, glass ? cw * 0.92 : cw * 0.55, glass ? ch * 0.18 : ch * 0.5);
          }
        }
        // crown light
        if (r() < 0.35) {
          ctx.fillStyle = rgba(r() < 0.5 ? RED : WHITE, 0.9);
          ctx.fillRect(x + bw / 2 - 1.5, top - 3, 3, 3);
        }
        x += bw + r() * minW * 0.6;
      }
      ctx.restore();
    }
    function trail(ctx, pts, c, width, alphaNear, alphaFar) {
      // pts: [[x,y],...] from near to far; drawn in three passes like a long exposure.
      const g = ctx.createLinearGradient(pts[0][0], pts[0][1], pts.at(-1)[0], pts.at(-1)[1]);
      g.addColorStop(0, rgba(c, alphaNear));
      g.addColorStop(1, rgba(c, alphaFar));
      const path = new Path2D();
      path.moveTo(...pts[0]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2,
          my = (pts[i][1] + pts[i + 1][1]) / 2;
        path.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      path.lineTo(...pts.at(-1));
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = g;
      ctx.filter = `blur(${K * (width * 2.2)}px)`;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = width * 5;
      ctx.stroke(path);
      ctx.filter = `blur(${K * (width * 0.6)}px)`;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = width * 1.8;
      ctx.stroke(path);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
      ctx.lineWidth = Math.max(0.6, width * 0.45);
      const core = ctx.createLinearGradient(pts[0][0], pts[0][1], pts.at(-1)[0], pts.at(-1)[1]);
      core.addColorStop(0, rgba([255, 250, 240], alphaNear * 0.9));
      core.addColorStop(1, rgba(c, alphaFar));
      ctx.strokeStyle = core;
      ctx.stroke(path);
      ctx.restore();
    }
    function bokeh(ctx, r, w, h, n, colors, rMin, rMax, yMin = 0, yMax = h, aMax = 0.22) {
      ctx.save();
      for (let i = 0; i < n; i++) {
        const x = r() * w,
          y = yMin + r() * (yMax - yMin),
          rad = rMin + r() * (rMax - rMin);
        const c = colors[Math.floor(r() * colors.length)],
          a = 0.05 + r() * aMax;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
        g.addColorStop(0, rgba(c, a * 0.8));
        g.addColorStop(0.7, rgba(c, a * 0.85));
        g.addColorStop(0.9, rgba(c, a * 0.6));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    function reflect(ctx, x, y, len, wid, c, a) {
      // a wet-road reflection: a soft vertical streak under a light
      ctx.save();
      ctx.filter = `blur(${K * (wid * 0.8)}px)`;
      const g = ctx.createLinearGradient(x, y, x, y + len);
      g.addColorStop(0, rgba(c, a));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - wid / 2, y, wid, len);
      ctx.restore();
    }
    function finish(
      ctx,
      w,
      h,
      r,
      grade = [
        [12, 30, 60],
        [60, 30, 10],
      ],
    ) {
      // colour grade: cool shadows on top, warm at the bottom
      ctx.save();
      ctx.globalCompositeOperation = 'soft-light';
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, rgba(grade[0], 0.6));
      g.addColorStop(1, rgba(grade[1], 0.5));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      // vignette
      const v = ctx.createRadialGradient(
        w / 2,
        h * 0.55,
        Math.min(w, h) * 0.35,
        w / 2,
        h * 0.55,
        Math.max(w, h) * 0.78,
      );
      v.addColorStop(0, 'rgba(0,0,0,0)');
      v.addColorStop(1, 'rgba(0,0,0,0.62)');
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, w, h);
      // film grain
      const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height),
        d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (r() - 0.5) * 7;
        d[i] += n;
        d[i + 1] += n;
        d[i + 2] += n;
      }
      ctx.putImageData(img, 0, 0);
    }
    function horizon(ctx, w, y, band, c = SODIUM, a = 0.22) {
      const g = ctx.createLinearGradient(0, y - band, 0, y + band);
      g.addColorStop(0, rgba(c, 0));
      g.addColorStop(0.5, rgba(c, a));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, y - band, w, band * 2);
    }
    function road(ctx, w, h, vx, vy, spread, wet = true) {
      const g = ctx.createLinearGradient(0, vy, 0, h);
      g.addColorStop(0, '#141a28');
      g.addColorStop(0.3, '#0b0f18');
      g.addColorStop(1, '#06080d');
      ctx.fillStyle = g;
      ctx.fillRect(0, vy, w, h - vy);
      if (wet) {
        ctx.save();
        ctx.filter = `blur(${K * 40}px)`;
        const s = ctx.createLinearGradient(0, vy, 0, h);
        s.addColorStop(0, 'rgba(150,160,200,0.16)');
        s.addColorStop(1, 'rgba(150,160,200,0.02)');
        ctx.fillStyle = s;
        ctx.beginPath();
        ctx.moveTo(vx - 30, vy);
        ctx.lineTo(vx + 30, vy);
        ctx.lineTo(vx + spread * 0.8, h);
        ctx.lineTo(vx - spread * 0.8, h);
        ctx.fill();
        ctx.restore();
      }
      horizon(ctx, w, vy, h * 0.06, [70, 70, 90], 0.5);
    }
    const lerp = (a, b, t) => a + (b - a) * t;
    // a point on the road at depth t (0 = horizon, 1 = bottom), lane position u (-1 left edge .. 1 right edge)
    const onRoad = (vx, vy, h, spread, t, u) => [vx + u * spread * t, lerp(vy, h, t)];

    const SCENES = {
      // Jubilee Hills: a tree-lined avenue, sodium lamps, rain-wet road and long-exposure trails.
      avenue(ctx, w, h, r) {
        const vx = w * 0.53,
          vy = h * 0.47,
          spread = w * 0.62;
        sky(ctx, w, h, vy, SODIUM, 0.3);
        towers(ctx, r, w, vy, {
          count: 60,
          minH: 20,
          maxH: 90,
          minW: 30,
          maxW: 90,
          lit: 0.25,
          palette: [WARM, COOL],
          blur: 2.5,
          shade: ['#0e1424', '#0b101c'],
        });
        road(ctx, w, h, vx, vy, spread);
        // trees along both sides: dark canopies, lit from below by the lamps
        for (const side of [-1, 1]) {
          for (let i = 0; i < 14; i++) {
            const t = Math.pow((i + 0.5) / 14, 1.6);
            const [x, y] = onRoad(vx, vy, h, spread, t, side * 1.25);
            const s = 18 + t * 360;
            ctx.save();
            ctx.filter = `blur(${K * (2 + t * 6)}px)`;
            ctx.fillStyle = '#04060a';
            for (let k = 0; k < 7; k++) {
              ctx.beginPath();
              ctx.ellipse(
                x + (r() - 0.5) * s,
                y - s * (0.9 + r() * 0.6),
                s * (0.35 + r() * 0.3),
                s * (0.25 + r() * 0.2),
                0,
                0,
                Math.PI * 2,
              );
              ctx.fill();
            }
            ctx.restore();
          }
        }
        ctx.globalCompositeOperation = 'lighter';
        for (const side of [-1, 1]) {
          for (let i = 0; i < 16; i++) {
            const t = Math.pow((i + 0.6) / 16, 1.7);
            const [x, y0] = onRoad(vx, vy, h, spread, t, side * 1.02);
            const ph = t * (h - vy) * 1.45,
              y = y0 - ph;
            const c = i % 5 === 2 ? WHITE : SODIUM;
            glow(ctx, x, y, 8 + t * 170, c, 0.55);
            glow(ctx, x, y, 2 + t * 26, WHITE, 0.9);
            reflect(ctx, x - side * t * 40, y0 + 4, 30 + t * 340, 3 + t * 30, c, 0.32);
            // light pooling on the canopy above
            glow(ctx, x, y - t * 40, 20 + t * 240, c, 0.08);
          }
        }
        // trails: red tail lights going away (left lanes), warm headlights coming (right lanes)
        for (let k = 0; k < 7; k++) {
          const u = -0.7 + k * 0.06 + r() * 0.04;
          const pts = [];
          for (let t = 1.05; t > 0.02; t -= 0.05)
            pts.push(onRoad(vx, vy, h, spread, t, u + Math.sin(t * 3 + k) * 0.015));
          trail(ctx, pts, RED, 2.2 + r() * 1.2, 0.95, 0.05);
        }
        for (let k = 0; k < 6; k++) {
          const u = 0.32 + k * 0.07 + r() * 0.04;
          const pts = [];
          for (let t = 1.05; t > 0.02; t -= 0.05) pts.push(onRoad(vx, vy, h, spread, t, u));
          trail(ctx, pts, WARM, 2 + r() * 1.4, 0.9, 0.05);
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        bokeh(ctx, r, w, h, 12, [SODIUM, WARM, RED], 40, 110, h * 0.05, h * 0.6, 0.1);
        ctx.restore();
        finish(ctx, w, h, r);
      },

      // Hitech City: glass towers over a curving road.
      towers(ctx, w, h, r) {
        const hy = h * 0.72;
        sky(ctx, w, h, hy, [120, 140, 255], 0.22);
        // far city haze
        towers(ctx, r, w, hy, {
          count: 80,
          minH: 40,
          maxH: 160,
          minW: 30,
          maxW: 80,
          lit: 0.3,
          palette: [COOL, WARM],
          blur: 3,
          shade: ['#121a30', '#0d1426'],
        });
        const haze = ctx.createLinearGradient(0, hy - h * 0.4, 0, hy);
        haze.addColorStop(0, 'rgba(60,70,130,0)');
        haze.addColorStop(1, 'rgba(60,70,130,0.35)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, hy - h * 0.4, w, h * 0.4);
        // hero towers
        towers(ctx, r, w, hy, {
          count: 14,
          minH: 260,
          maxH: h * 0.66,
          minW: 110,
          maxW: 230,
          lit: 0.55,
          palette: [COOL, COOL, WHITE, WARM],
          blur: 1.4,
          shade: ['#0c1326', '#05080f'],
          glass: true,
        });
        ctx.globalCompositeOperation = 'lighter';
        // aircraft warning lights + skyline glow
        glow(ctx, w * 0.5, hy, w * 0.6, [90, 110, 220], 0.12);
        // road: a wide curve across the bottom
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, hy, w, h - hy);
        ctx.globalCompositeOperation = 'lighter';
        for (let k = 0; k < 12; k++) {
          const f = Math.pow((k + 1) / 12, 1.6);
          const yb = hy + 10 + f * (h - hy - 30);
          const c = k % 3 === 0 ? WARM : RED;
          const pts = [];
          for (let x = -40; x <= w + 40; x += 60)
            pts.push([x, yb - Math.sin((x / w) * Math.PI) * 40 * f + (r() - 0.5) * 1.5]);
          if (c === WARM) pts.reverse();
          trail(ctx, pts, c, 0.6 + f * 2.2, 0.6 + f * 0.35, 0.55);
        }
        // reflections of towers in the wet road
        for (let i = 0; i < 90; i++)
          reflect(ctx, r() * w, hy + 4, 80 + r() * 200, 2 + r() * 8, r() < 0.7 ? COOL : WARM, 0.1);
        bokeh(ctx, r, w, h, 6, [COOL, WARM], 80, 160, h * 0.05, h * 0.4, 0.06);
        ctx.globalCompositeOperation = 'source-over';
        finish(ctx, w, h, r, [
          [10, 30, 80],
          [40, 30, 30],
        ]);
      },

      // Durgam Cheruvu: the lit cable bridge over the lake, Hitech City behind.
      bridge(ctx, w, h, r) {
        const hy = h * 0.6;
        sky(ctx, w, h, hy, [150, 120, 255], 0.2);
        towers(ctx, r, w, hy - 4, {
          count: 50,
          minH: 60,
          maxH: 260,
          minW: 50,
          maxW: 140,
          lit: 0.45,
          palette: [COOL, WARM, WHITE],
          blur: 1.8,
          shade: ['#101a30', '#0b1222'],
        });
        // hills
        ctx.fillStyle = '#05080f';
        ctx.beginPath();
        ctx.moveTo(0, hy);
        for (let x = 0; x <= w; x += 40) ctx.lineTo(x, hy - 18 - Math.sin(x / 210) * 10 - r() * 6);
        ctx.lineTo(w, hy);
        ctx.fill();
        // lake
        const lg = ctx.createLinearGradient(0, hy, 0, h);
        lg.addColorStop(0, '#0b1020');
        lg.addColorStop(1, '#03050a');
        ctx.fillStyle = lg;
        ctx.fillRect(0, hy, w, h - hy);
        // bridge
        const deckY = hy - 30,
          px = w * 0.56,
          top = h * 0.12;
        ctx.globalCompositeOperation = 'lighter';
        const cableC = (i) => (i % 2 ? ION : MAGENTA);
        for (let i = 0; i < 26; i++) {
          const side = i < 13 ? -1 : 1,
            k = (i % 13) + 1;
          const x = px + side * k * (w * 0.034);
          ctx.save();
          ctx.filter = `blur(${K * 1.2}px)`;
          ctx.strokeStyle = rgba(cableC(k), 0.55);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, top + k * 9);
          ctx.lineTo(x, deckY);
          ctx.stroke();
          ctx.restore();
          ctx.strokeStyle = rgba(WHITE, 0.35);
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(px, top + k * 9);
          ctx.lineTo(x, deckY);
          ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#070a12';
        ctx.beginPath();
        ctx.moveTo(px - 10, deckY + 12);
        ctx.lineTo(px - 4, top - 10);
        ctx.lineTo(px + 4, top - 10);
        ctx.lineTo(px + 10, deckY + 12);
        ctx.fill();
        ctx.fillRect(w * 0.02, deckY, w * 0.96, 10);
        ctx.globalCompositeOperation = 'lighter';
        glow(ctx, px, top + 40, 160, MAGENTA, 0.18);
        glow(ctx, px, top - 10, 14, RED, 0.9);
        for (let x = w * 0.03; x < w * 0.97; x += 26) {
          glow(ctx, x, deckY + 2, 18, WARM, 0.5);
          glow(ctx, x, deckY + 2, 3, WHITE, 0.9);
        }
        // trails across the deck
        trail(
          ctx,
          [
            [w * 0.02, deckY - 3],
            [w * 0.5, deckY - 4],
            [w * 0.98, deckY - 3],
          ],
          RED,
          1.6,
          0.9,
          0.9,
        );
        trail(
          ctx,
          [
            [w * 0.98, deckY - 6],
            [w * 0.5, deckY - 7],
            [w * 0.02, deckY - 6],
          ],
          WARM,
          1.6,
          0.9,
          0.9,
        );
        ctx.globalCompositeOperation = 'source-over';
        // the lake mirrors everything above, broken by ripples
        const src = ctx.getImageData(0, 0, ctx.canvas.width, Math.floor(hy * K));
        const tmp = document.createElement('canvas');
        tmp.width = ctx.canvas.width;
        tmp.height = Math.floor(hy * K);
        tmp.getContext('2d').putImageData(src, 0, 0);
        ctx.save();
        ctx.translate(0, hy * 2);
        ctx.scale(1, -1);
        ctx.globalAlpha = 0.5;
        ctx.filter = `blur(${K * 3}px)`;
        for (let y = 0; y < hy; y += 3) {
          const off = Math.sin(y * 0.35) * 6 * (1 - y / hy);
          ctx.drawImage(tmp, 0, y * K, w * K, 3 * K, off, y, w, 3);
        }
        ctx.restore();
        const fade = ctx.createLinearGradient(0, hy, 0, h);
        fade.addColorStop(0, 'rgba(3,5,10,0.1)');
        fade.addColorStop(1, 'rgba(3,5,10,0.9)');
        ctx.fillStyle = fade;
        ctx.fillRect(0, hy, w, h - hy);
        ctx.globalCompositeOperation = 'lighter';
        bokeh(ctx, r, w, h, 14, [MAGENTA, ION, WARM], 50, 120, h * 0.65, h, 0.1);
        ctx.globalCompositeOperation = 'source-over';
        finish(ctx, w, h, r, [
          [20, 20, 80],
          [30, 10, 40],
        ]);
      },

      // Gachibowli flyover: an S-curve of light seen from above the city.
      flyover(ctx, w, h, r) {
        const hy = h * 0.3;
        sky(ctx, w, h, hy, SODIUM, 0.25);
        const fg = ctx.createLinearGradient(0, hy, 0, h);
        fg.addColorStop(0, '#141826');
        fg.addColorStop(0.15, '#080b13');
        fg.addColorStop(1, '#05070c');
        ctx.fillStyle = fg;
        ctx.fillRect(0, hy, w, h - hy);
        horizon(ctx, w, hy, h * 0.05, SODIUM, 0.25);
        // the city grid below: thousands of tiny lights fading with distance
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 3800; i++) {
          const t = Math.pow(r(), 1.8),
            y = lerp(hy + 2, h, t),
            x = r() * w;
          const c = r() < 0.6 ? SODIUM : r() < 0.5 ? WHITE : COOL;
          const s = 0.6 + t * 2.4;
          ctx.fillStyle = rgba(c, 0.25 + r() * 0.6);
          ctx.fillRect(x, y, s, s);
          if (r() < 0.04) glow(ctx, x, y, 6 + t * 30, c, 0.25);
        }
        // the flyover: S-curve, many trails
        for (let k = 0; k < 16; k++) {
          const off = (k - 8) * 4.2,
            c = k < 8 ? RED : WARM,
            pts = [];
          for (let s = 0; s <= 1.0001; s += 0.03) {
            const f = 1 - 0.88 * s;
            const x = lerp(-80, w * 0.92, s) + Math.sin(s * Math.PI * 1.4) * w * 0.12,
              y = lerp(h * 1.08, hy + 10, Math.pow(s, 0.75));
            pts.push([x + off * 2.4 * f, y + off * 1.2 * f]);
          }
          if (k >= 8) pts.reverse();
          trail(ctx, pts, c, 0.9 + r() * 0.6, k >= 8 ? 0.3 : 0.85, k >= 8 ? 0.85 : 0.3);
        }
        bokeh(ctx, r, w, h, 12, [SODIUM, WARM], 60, 140, h * 0.5, h, 0.08);
        ctx.globalCompositeOperation = 'source-over';
        finish(ctx, w, h, r);
      },

      // A RECALL screen on a bike, waiting at a signal: everything else falls into soft lights.
      hero(ctx, w, h, r) {
        const vx = w * 0.42,
          vy = h * 0.5,
          spread = w * 0.75;
        sky(ctx, w, h, vy, SODIUM, 0.3);
        road(ctx, w, h, vx, vy, spread);
        towers(ctx, r, w, vy + 30, {
          count: 50,
          minH: 60,
          maxH: 250,
          minW: 40,
          maxW: 120,
          lit: 0.4,
          palette: [WARM, COOL],
          blur: 9,
          shade: ['#0f1526', '#0b1020'],
        });
        horizon(ctx, w, vy + 20, h * 0.08, [20, 24, 36], 0.9);
        ctx.globalCompositeOperation = 'lighter';
        // out-of-focus street: big soft discs
        bokeh(ctx, r, w, h, 28, [SODIUM, WARM, RED, SODIUM], 40, 150, h * 0.05, h * 0.62, 0.14);
        bokeh(ctx, r, w, h, 10, [SODIUM, WARM], 120, 260, h * 0.0, h * 0.5, 0.06);
        for (let k = 0; k < 5; k++) {
          const pts = [];
          for (let t = 1.05; t > 0.05; t -= 0.05)
            pts.push(onRoad(vx, vy, h, spread, t, 0.35 + k * 0.08));
          ctx.save();
          ctx.filter = `blur(${K * 10}px)`;
          trail(ctx, pts, WARM, 3, 0.5, 0.05);
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'source-over';
        // close-up: the box on the rack, its screen lit; the rider and bike fall into shadow at the frame edge
        const s = h / 1000,
          cx = w * 0.64,
          cy = h * 0.5;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.transform(1, -0.035, 0.06, 1, 0, 0); // a slight three-quarter turn
        const sw = 560 * s,
          sh = 390 * s;
        // shadowed rider's back above, rack and tail below
        ctx.globalCompositeOperation = 'lighter';
        glow(ctx, 0, 0, 900 * s, VOLT, 0.14);
        ctx.globalCompositeOperation = 'source-over';
        // the box: a dark shell with a bevel
        const shell = ctx.createLinearGradient(0, -sh / 2 - 30 * s, 0, sh / 2 + 40 * s);
        shell.addColorStop(0, '#1b2130');
        shell.addColorStop(1, '#090c13');
        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.roundRect(-sw / 2 - 30 * s, -sh / 2 - 30 * s, sw + 60 * s, sh + 70 * s, 26 * s);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 2 * s;
        ctx.stroke();
        // the screen
        const sg = ctx.createLinearGradient(-sw / 2, -sh / 2, sw / 2, sh / 2);
        sg.addColorStop(0, '#dcfc6a');
        sg.addColorStop(1, '#b0e432');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.roundRect(-sw / 2, -sh / 2, sw, sh, 8 * s);
        ctx.fill();
        ctx.fillStyle = '#0a0e17';
        ctx.font = `italic 700 ${118 * s}px Georgia, serif`;
        ctx.fillText('Chai.', -sw / 2 + 46 * s, -sh / 2 + 160 * s);
        ctx.font = `600 ${38 * s}px Arial, sans-serif`;
        ctx.fillText('Hot in 10 minutes', -sw / 2 + 50 * s, -sh / 2 + 228 * s);
        ctx.beginPath();
        ctx.roundRect(-sw / 2 + 50 * s, -sh / 2 + 280 * s, 230 * s, 58 * s, 29 * s);
        ctx.fill();
        ctx.fillStyle = '#c8f54a';
        ctx.font = `700 ${24 * s}px Arial, sans-serif`;
        ctx.fillText('ORDER NOW  →', -sw / 2 + 78 * s, -sh / 2 + 318 * s);
        // pixel texture and glass sheen
        ctx.fillStyle = 'rgba(10,14,23,0.06)';
        for (let y = -sh / 2; y < sh / 2; y += 4 * s) ctx.fillRect(-sw / 2, y, sw, 1.2 * s);
        const sh2 = ctx.createLinearGradient(-sw / 2, -sh / 2, sw * 0.1, sh / 2);
        sh2.addColorStop(0, 'rgba(255,255,255,0.22)');
        sh2.addColorStop(0.45, 'rgba(255,255,255,0.02)');
        sh2.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sh2;
        ctx.beginPath();
        ctx.roundRect(-sw / 2, -sh / 2, sw, sh, 8 * s);
        ctx.fill();
        // a small brand mark on the shell
        ctx.fillStyle = 'rgba(244,245,240,0.55)';
        ctx.font = `700 ${18 * s}px Arial, sans-serif`;
        ctx.fillText('RECALL', -sw / 2 - 4 * s, sh / 2 + 28 * s);
        ctx.restore();
        // tail light below, and the screen's spill on the wet road
        ctx.globalCompositeOperation = 'lighter';
        glow(ctx, cx + 10 * s, cy + 330 * s, 160 * s, RED, 0.6);
        glow(ctx, cx + 10 * s, cy + 330 * s, 22 * s, [255, 210, 200], 0.9);
        reflect(ctx, cx, h * 0.93, 200 * s, 420 * s, VOLT, 0.08);
        ctx.globalCompositeOperation = 'source-over';
        finish(ctx, w, h, r);
      },
    };
    function roundRect(ctx, x, y, w, h, rr) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, rr);
    }

    window.render = (name, w, h, seed, k = 1, type = 'image/webp', q = 0.9) => {
      K = k;
      const c = document.getElementById('c');
      c.width = Math.round(w * k);
      c.height = Math.round(h * k);
      const ctx = c.getContext('2d');
      ctx.setTransform(k, 0, 0, k, 0, 0);
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      SCENES[name](ctx, w, h, rng(seed));
      return c.toDataURL(type, q);
    };
  </script>
</body>
